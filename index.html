  <style>
    :root {
      --bg: #003D43;
      --fg: #FFFFFF;
      --fg-soft: rgba(255,255,255,0.68);
      --fg-faint: rgba(255,255,255,0.42);
      --line: rgba(255,255,255,0.18);
      --panel: rgba(255,255,255,0.04);
      --rose: #C6899B;
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      margin: 0;
      font-family: "Pretendard Variable", Pretendard, -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Segoe UI", Roboto, sans-serif;
      color: var(--fg);
      background: var(--bg);
      -webkit-font-smoothing: antialiased;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px 16px;
      padding-top: calc(24px + env(safe-area-inset-top, 0px));
      padding-bottom: calc(24px + env(safe-area-inset-bottom, 0px));
    }
    .card {
      width: 100%;
      max-width: 420px;
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 24px;
      padding: 40px 28px 28px;
      text-align: center;
    }
    .mark {
      width: 88px;
      height: 88px;
      margin: 0 auto 24px;
      border-radius: 22px;
      border: 1px solid rgba(255,255,255,0.28);
      box-shadow: 0 0 0 4px rgba(255,255,255,0.06);
      overflow: hidden;
    }
    .mark img { width: 100%; height: 100%; display: block; }
    h1 {
      margin: 0 0 8px;
      font-size: 24px;
      font-weight: 700;
      letter-spacing: -0.02em;
    }
    .lead {
      margin: 0 0 32px;
      color: var(--fg-soft);
      font-size: 15px;
      line-height: 1.55;
    }
    .store {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      width: 100%;
      min-height: 56px;
      margin: 0 0 12px;
      padding: 0 20px;
      border-radius: 14px;
      text-decoration: none;
      font-size: 16px;
      font-weight: 600;
      color: var(--bg);
      background: var(--fg);
      transition: transform .12s ease, opacity .12s ease;
    }
    .store:active { transform: scale(.98); opacity: .9; }
    .store:focus-visible { outline: 3px solid var(--rose); outline-offset: 3px; }
    .store svg { width: 22px; height: 22px; flex: none; }
    .store-android { background: var(--rose); color: var(--bg); }
    .hidden { display: none !important; }

    .desktop-note {
      margin: 28px 0 0;
      padding-top: 24px;
      border-top: 1px solid var(--line);
      color: var(--fg-soft);
      font-size: 14px;
      line-height: 1.5;
    }
    #qr {
      width: 148px;
      height: 148px;
      margin: 14px auto 0;
      padding: 10px;
      background: #fff;
      border-radius: 12px;
    }
    #qr img, #qr canvas { width: 128px !important; height: 128px !important; display: block; }

    .foot {
      margin: 28px 0 0;
      color: var(--fg-faint);
      font-size: 12px;
    }
    .foot a { color: inherit; }

    @media (prefers-reduced-motion: reduce) {
      .store { transition: none; }
    }
  </style>
</head>

  <script>
    (function () {
      var ua = navigator.userAgent || '';
      var isAndroid = /android/i.test(ua);
      var isIOS = /iPad|iPhone|iPod/.test(ua) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);

      var android = document.getElementById('btn-android');
      var ios = document.getElementById('btn-ios');
      var desktop = document.getElementById('desktop');

      // 모바일: 버튼을 먼저 보여주고(이동 차단 대비) 즉시 스토어로 이동
      function go(el) {
        el.classList.remove('hidden');
        document.getElementById('lead').innerHTML =
          '스토어로 이동하고 있습니다.<br>이동하지 않으면 아래 버튼을 눌러주세요.';

      }

      if (isAndroid) {
        go(android);
      } else if (isIOS) {
        go(ios);
      } else {
        android.classList.remove('hidden');
        ios.classList.remove('hidden');
        desktop.classList.remove('hidden');
        if (window.QRCode) {
          new QRCode(document.getElementById('qr'), {
            text: location.href,
            width: 128, height: 128,
            colorDark: '#003D43', colorLight: '#FFFFFF',
            correctLevel: QRCode.CorrectLevel.M
          });
        } else {
          document.getElementById('qr').classList.add('hidden');
        }
      }
    })();
